<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garching Board</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            background: #121212;
            color: #e0e0e0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        main { width: 100%; max-width: 360px; }
        h1 { margin: 0 0 32px; font-size: 1.5rem; font-weight: 300; }
        label { display: block; margin-bottom: 10px; color: #bbb; }
        input, button { width: 100%; font: inherit; border-radius: 12px; }
        input { padding: 14px; border: 1px solid #555; background: #1e1e1e; color: #e0e0e0; }
        button { margin-top: 16px; padding: 16px; border: 0; background: #90caf9; color: #102234; font-weight: 600; cursor: pointer; }
        button:hover { background: #b1daff; }
        input:focus-visible, button:focus-visible { outline: 2px solid #bb86fc; outline-offset: 3px; }
        .error { color: #ffb4b4; margin: 12px 0 0; }
    </style>
</head>
<body>
    <main>
        <h1>Garching Board</h1>
        <form action="/login" method="post">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required autofocus{% if error %} aria-invalid="true" aria-describedby="login-error"{% endif %}>
            {% if error %}<p class="error" id="login-error" role="alert">{{ error }}</p>{% endif %}
            <button type="submit">Open board</button>
        </form>
    </main>
</body>
</html>
