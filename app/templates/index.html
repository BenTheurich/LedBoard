<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Controller</title>
    <style>
        body {
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Changed from center to flex-start to prevent weird scrolling */
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px; /* Added top padding */
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 30px 0; /* Clean margins */
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #888;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        form {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button:active {
            transform: scale(0.98);
            background-color: #333;
        }

        /* Colors */
        button[value="OFF"] {
            background-color: #cf6679;
            color: #000;
            font-weight: bold;
            justify-content: center;
            margin-top: 20px;
        }

        button[value="Pong"] { border-left: 5px solid #03dac6; }
        button[value="Clock"] { border-left: 5px solid #bb86fc; }
        button[value="Bus Timetable"] { border-left: 5px solid #ffb74d; }
        button[value="Game of Life"] { border-left: 5px solid #a0c4ff; }
        button[value="Music Visualizer"] { border-left: 5px solid #ff80ab; }
        button[value="Falling Sand"] { border-left: 5px solid #e4bf7b; }
        button[value="Drawing Harmonograph"] { border-left: 5px solid #b5a8e8; }
        button[value="Acid Rain"] { border-left: 5px solid #8fcf94; }

        h2, .message-label {
            display: block;
            margin: 12px 0 0;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 14px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #1e1e1e;
            color: #e0e0e0;
            font: inherit;
            resize: vertical;
        }
        textarea:focus-visible, button:focus-visible, canvas:focus-visible, input:focus-visible {
            outline: 2px solid #bb86fc;
            outline-offset: 3px;
        }
        textarea::placeholder { color: #999; opacity: 1; }
        button[value="Weather"] { border-left: 5px solid #80cbc4; }
        .send-button {
            background: #90caf9;
            color: #102234;
            justify-content: center;
            gap: 10px;
            padding: 16px 20px;
            font-weight: 600;
        }
        .send-button:hover { background: #b1daff; }
        .send-button:active { background: #79b9ed; }
        .send-button svg { width: 22px; height: 22px; flex-shrink: 0; }
        .editor-status, .zoom-label {
            font-size: 0.9rem;
            line-height: 1.5;
            color: #bbb;
        }
        .editor-status { margin: 8px 0 0; }
        .editor-status:empty { display: none; }
        .editor-status.error { color: #ffb4b4; }
        .drawing-tools { display: flex; flex-wrap: wrap; gap: 8px; }
        .drawing-tools button {
            width: auto;
            min-width: 44px;
            min-height: 44px;
            padding: 10px 12px;
            justify-content: center;
            box-shadow: none;
        }
        .drawing-tools button { font-size: 1rem; }
        .drawing-tools button[aria-pressed="true"] { background: #f4c47c; color: #121212; }
        button:disabled { opacity: 0.5; cursor: default; }
        .mode-form[aria-busy="true"] button:disabled { opacity: 1; }
        .drawing-tools { margin: 12px 0; }
        .drawing-viewport { overflow: auto; border: 1px solid #555; border-radius: 6px; }
        #pixel-canvas {
            display: block;
            width: 100%;
            height: auto;
            touch-action: none;
            user-select: none;
            cursor: crosshair;
        }
        .zoom-label { display: flex; align-items: center; gap: 12px; margin: 12px 0; }
        .zoom-label input { flex: 1; min-width: 0; accent-color: #f4c47c; }
        .scenes-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 12px 0; }
        .scenes-heading h2 { margin: 0; }
        .scene-save, .scene-retry {
            width: auto;
            min-height: 44px;
            padding: 10px 14px;
            font-size: 0.95rem;
            box-shadow: none;
            justify-content: center;
            gap: 8px;
        }
        .scene-save { background: #f4c47c; color: #121212; font-weight: 600; }
        .scene-save:hover:not(:disabled) { background: #ffdaa2; }
        .scene-save svg { width: 18px; height: 18px; }
        .scene-current { margin-bottom: 12px; }
        .scene-current-label { display: block; margin-bottom: 8px; color: #bbb; font-size: 0.8rem; }
        .scene-preview { display: block; width: 100%; height: auto; border-radius: 6px; image-rendering: pixelated; }
        .scene-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
        .scene-card { display: block; min-width: 0; padding: 10px; box-shadow: none; }
        .scene-card:hover { background: #292929; }
        .scene-card[aria-pressed="true"] { outline: 1px solid #f4c47c; }
        .scene-card:focus-visible { outline: 2px solid #bb86fc; }
        .scene-caption { display: flex; justify-content: space-between; align-items: center; gap: 6px; margin-top: 10px; font-size: 0.8rem; }
        .scene-action { display: flex; align-items: center; gap: 4px; color: #f4c47c; }
        .scene-action svg { width: 12px; height: 12px; }
        #scene-hint { margin: 0 0 12px; }
        [hidden] { display: none !important; }
        @media (prefers-reduced-motion: reduce) {
            button, .indicator { transition: none; }
        }

        /* The Dot Indicator */
        .indicator {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background-color: #333; /* Default Grey */
            transition: background-color 0.3s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        /* When Active (Green) */
        .indicator.active {
            background-color: #00e676; /* Bright Green */
            box-shadow: 0 0 8px #00e676; /* Glow effect */
        }

    </style>
</head>
<body>

    <h1>Control Center</h1>

    <div class="grid">
        <h2>Everyday</h2>
        {% for name in groups['Everyday'] %}
            <form action="/run" method="post" class="mode-form">
                <button type="submit" name="script_name" value="{{ name }}"{% if name == 'Weather' %} title="Forecasts by Open-Meteo"{% endif %}>
                    <span class="mode-label">{{ name }}</span>
                    <span data-mode="{{ name }}" class="indicator {% if name == active_script %}active{% endif %}" aria-label="{{ 'Active' if name == active_script else 'Inactive' }}"></span>
                </button>
                <p class="editor-status" role="status" aria-live="polite"></p>
            </form>
        {% endfor %}

        <form id="message" action="/message#message" method="post">
            <label class="message-label" for="message-text">Message</label>
            <textarea id="message-text" name="message" rows="2" maxlength="{{ max_message_length }}" placeholder="Type your message here" autocomplete="off" required{% if message_error %} aria-invalid="true" aria-describedby="message-error" autofocus{% endif %}>{{ message_value }}</textarea>
            <button class="send-button" type="submit" name="script_name" value="Message Board" aria-label="Send message">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                <span class="send-label" aria-live="polite">Send</span>
            </button>
            <p class="editor-status{% if message_error %} error{% endif %}" id="message-error" role="status" aria-live="polite">{{ message_error or '' }}</p>
        </form>

        <form id="drawing" action="/drawing" method="post" data-width="{{ drawing_width }}" data-height="{{ drawing_height }}">
            <h2 id="drawing-title">Pixel drawing</h2>
            <div class="drawing-tools" role="group" aria-label="Drawing tools">
                <button type="button" data-tool="draw" aria-pressed="true">Draw</button>
                <button type="button" data-tool="erase" aria-pressed="false">Erase</button>
                <button type="button" id="drawing-undo" disabled>Undo</button>
                <button type="button" id="drawing-clear">Clear</button>
            </div>
            <div class="drawing-viewport">
                <canvas id="pixel-canvas" width="768" height="192" tabindex="0" role="img" aria-label="64 by 16 pixel drawing editor. Arrow keys move; Space paints.">Enable JavaScript to draw on the matrix.</canvas>
            </div>
            <label class="zoom-label" for="drawing-zoom">Zoom <input id="drawing-zoom" type="range" min="1" max="3" step="0.5" value="1"><output id="zoom-value" for="drawing-zoom">1×</output></label>
            <input type="hidden" name="pixels" id="drawing-pixels">
            <button class="send-button" type="submit" name="script_name" value="Pixel Drawing" aria-label="Send drawing" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg>
                <span class="send-label" aria-live="polite">Send</span>
            </button>
            <p class="editor-status{% if drawing_error %} error{% endif %}" id="drawing-error" role="status" aria-live="polite">{{ drawing_error or '' }}</p>
        </form>

        <section id="scenes" aria-labelledby="scenes-title">
            <div class="scenes-heading">
                <h2 id="scenes-title">Scenes</h2>
                <button class="scene-save" id="scene-save" type="button" data-board-command disabled aria-label="Save the drawing on the board">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h12l4 4v12a2 2 0 0 1-2 2Z"/><path d="M7 3v6h10V3M7 21v-8h10v8"/></svg>
                    <span id="scene-save-label">Save scene</span>
                </button>
            </div>
            <div class="scene-current" id="scene-current" hidden>
                <span class="scene-current-label">On board</span>
                <canvas class="scene-preview" id="scene-current-preview" width="768" height="192" role="img" aria-label="Drawing currently on the board"></canvas>
            </div>
            <p class="editor-status" id="scene-hint"></p>
            <div class="scene-grid" id="scene-list" aria-label="Saved scenes"></div>
            <p class="editor-status" id="scene-status" role="status" aria-live="polite"></p>
            <button class="scene-retry" id="scene-retry" type="button" hidden>Retry</button>
            <noscript><p class="editor-status">Enable JavaScript to save and play scenes.</p></noscript>
        </section>

        <h2>Visualizers</h2>
        {% for name in groups['Visualizers'] %}
            <form action="/run" method="post" class="mode-form">
                <button type="submit" name="script_name" value="{{ name }}">
                    <span class="mode-label">{{ name }}</span>
                    <span data-mode="{{ name }}" class="indicator {% if name == active_script %}active{% endif %}" aria-label="{{ 'Active' if name == active_script else 'Inactive' }}"></span>
                </button>
                <p class="editor-status" role="status" aria-live="polite"></p>
            </form>
        {% endfor %}

        <form action="/run" method="post" class="mode-form">
            <button type="submit" name="script_name" value="OFF">
                <span class="mode-label">TURN OFF</span>
            </button>
            <p class="editor-status" role="status" aria-live="polite"></p>
        </form>
    </div>

    <script src="{{ url_for('static', filename='editors.js') }}" defer></script>
</body>
</html>
