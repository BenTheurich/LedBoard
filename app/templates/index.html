<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matrix Controller</title>
    <style>
        body {
            background-color: #121212;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Changed from center to flex-start to prevent weird scrolling */
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 40px 20px; /* Added top padding */
            box-sizing: border-box;
        }

        h1 {
            margin: 0 0 30px 0; /* Clean margins */
            font-weight: 300;
            letter-spacing: 2px;
            text-transform: uppercase;
            font-size: 1.5rem;
            color: #888;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
            max-width: 400px;
        }

        form {
            width: 100%;
        }

        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            background-color: #1e1e1e;
            color: #e0e0e0;
            font-size: 1.2rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            text-align: left;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        button:active {
            transform: scale(0.98);
            background-color: #333;
        }

        /* Colors */
        button[value="OFF"] {
            background-color: #cf6679;
            color: #000;
            font-weight: bold;
            justify-content: center;
            margin-top: 20px;
        }

        button[value="Pong"] { border-left: 5px solid #03dac6; }
        button[value="Clock"] { border-left: 5px solid #bb86fc; }
        button[value="Bus Timetable"] { border-left: 5px solid #ffb74d; }
        button[value="Game of Life"] { border-left: 5px solid #a0c4ff; }
        button[value="Music Visualizer"] { border-left: 5px solid #ff80ab; }
        button[value="Falling Sand"] { border-left: 5px solid #e4bf7b; }
        button[value="Drawing Harmonograph"] { border-left: 5px solid #b5a8e8; }
        button[value="Acid Rain"] { border-left: 5px solid #8fcf94; }

        h2, .message-label {
            display: block;
            margin: 12px 0 0;
            color: #aaa;
            font-size: 0.9rem;
            font-weight: 500;
        }
        textarea {
            width: 100%;
            box-sizing: border-box;
            margin: 10px 0;
            padding: 14px;
            border: 1px solid #555;
            border-radius: 12px;
            background: #1e1e1e;
            color: #e0e0e0;
            font: inherit;
            resize: vertical;
        }
        textarea:focus-visible, button:focus-visible {
            outline: 2px solid #bb86fc;
            outline-offset: 3px;
        }
        textarea::placeholder { color: #999; opacity: 1; }
        .message-error { color: #ffb4b4; margin: 0 0 10px; font-size: 0.9rem; }
        button[value="Weather"] { border-left: 5px solid #80cbc4; }
        button[value="Message Board"] { border-left: 5px solid #90caf9; }

        /* The Dot Indicator */
        .indicator {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background-color: #333; /* Default Grey */
            transition: background-color 0.3s ease;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.5);
        }

        /* When Active (Green) */
        .indicator.active {
            background-color: #00e676; /* Bright Green */
            box-shadow: 0 0 8px #00e676; /* Glow effect */
        }

    </style>
</head>
<body>

    <h1>Control Center</h1>

    <div class="grid">
        <h2>Everyday</h2>
        {% for name in groups['Everyday'] %}
            <form action="/run" method="post">
                <button type="submit" name="script_name" value="{{ name }}"{% if name == 'Weather' %} title="Forecasts by Open-Meteo"{% endif %}>
                    {{ name }}
                    <span class="indicator {% if name == active_script %}active{% endif %}" aria-label="{{ 'Active' if name == active_script else 'Inactive' }}"></span>
                </button>
            </form>
        {% endfor %}

        <form id="message" action="/message" method="post">
            <label class="message-label" for="message-text">Message</label>
            <textarea id="message-text" name="message" rows="2" maxlength="{{ max_message_length }}" placeholder="Type your message here" autocomplete="off" required{% if message_error %} aria-invalid="true" aria-describedby="message-error" autofocus{% endif %}>{{ message_value }}</textarea>
            {% if message_error %}<p class="message-error" id="message-error" role="alert">{{ message_error }}</p>{% endif %}
            <button type="submit" name="script_name" value="Message Board">
                Send
                <span class="indicator {% if active_script == 'Message Board' %}active{% endif %}" aria-label="{{ 'Active' if active_script == 'Message Board' else 'Inactive' }}"></span>
            </button>
        </form>

        <h2>Visualizers</h2>
        {% for name in groups['Visualizers'] %}
            <form action="/run" method="post">
                <button type="submit" name="script_name" value="{{ name }}">
                    {{ name }}
                    <span class="indicator {% if name == active_script %}active{% endif %}" aria-label="{{ 'Active' if name == active_script else 'Inactive' }}"></span>
                </button>
            </form>
        {% endfor %}

        <form action="/run" method="post">
            <button type="submit" name="script_name" value="OFF">
                TURN OFF
            </button>
        </form>
    </div>

</body>
</html>
